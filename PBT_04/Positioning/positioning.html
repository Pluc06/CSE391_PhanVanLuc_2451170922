<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Playground</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>

    <header class="header">
        <div class="logo">MyLogo</div>
        <nav class="nav">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="container">
        
        <aside class="sidebar">
            <h3>Danh mục</h3>
            <ul>
                <li><a href="#">Điện thoại</a></li>
                <li><a href="#">Laptop</a></li>
                <li><a href="#">Phụ kiện</a></li>
            </ul>
        </aside>

        <main class="content">
            <h2>Sản phẩm nổi bật</h2>
            
            <div class="product-grid">

                    <div class="product-img">Ảnh sản phẩm 1</div>
                    <h4>iPhone 15 Pro Max</h4>

                </div>

                <div class="product-card">
                    <span class="badge-hot">HOT</span>
                    <div class="product-img">Ảnh sản phẩm 3</div>
                    <h4>iPad Pro M2</h4>
                    <p>Giá: 22.000.000đ</p>
                </div>
            </div>

            <div class="dummy-space">
                <p>Demo content</p>
                <div style="height: 1200px;"></div> <p>End content</p>
            </div>

    <button class="scroll-top-btn">↑</button>
