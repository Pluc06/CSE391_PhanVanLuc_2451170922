<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Box Model Lab</title>
    <link rel="stylesheet" href="boxmodel.css">
</head>
<body>

    <section>
        <h2>Phần 1 — Chứng minh content-box vs border-box</h2>
        <div class="part1-container">
            <div class="box-1">Hộp 1: content-box</div>
            <div class="box-2">Hộp 2: border-box</div>
        </div>
    </section>

    <br><br><hr><br>

    <section>
        <h2>Phần 2 — Layout 3 cột (Tổng container = 1000px)</h2>
        <div class="container-1000">
            <div class="sidebar-left">Cột trái (sidebar)<br>Width: 250px, Padding: 15px</div>
            <div class="main-content">Cột giữa (content)<br>Width: 500px, Padding: 20px</div>
            <div class="sidebar-right">Cột phải (ads)<br>Width: 250px, Padding: 15px</div>
        </div>
    </section>

</body>
</html>
